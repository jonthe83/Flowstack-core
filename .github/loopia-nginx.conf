# Loopia nginx ignores .htaccess. This file is the host snippet.
# It is not applied by deploy. Put it in the vhost by hand.
# A real file under the web root is still served before PHP.
# HSTS stays max-age only. Do not widen it to subdomains.

location ^~ /private/       { deny all; return 403; }
location ^~ /data/          { deny all; return 403; }
location ^~ /schema/        { deny all; return 403; }
location ^~ /src/           { deny all; return 403; }
location ^~ /tests/         { deny all; return 403; }
location ^~ /fullmakt/data/ { deny all; return 403; }
location ^~ /fullmakt/lib/  { deny all; return 403; }
location ^~ /fullmakt/vendor/ { deny all; return 403; }
location ^~ /gi/data/       { deny all; return 403; }
location ^~ /privat/fullmakt/signed/ { deny all; return 403; }
location ^~ /data/.private/fullmakt/signed/ { deny all; return 403; }
# Filename in any directory. An exact root match leaves /fullmakt/README.md public.
location ~* (^|/)README\.md$ { deny all; return 403; }
location ~* (^|/)AGENTS\.md$ { deny all; return 403; }

# Versioned files under /assets (?v=mtime). A new mtime is a new cache key.
# gzip here covers css/js that nginx serves itself. PHP still compresses HTML.
location ~* ^/assets/.+\.(css|js|svg|woff2?|png|jpe?g|gif|webp|ico)$ {
    etag on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
