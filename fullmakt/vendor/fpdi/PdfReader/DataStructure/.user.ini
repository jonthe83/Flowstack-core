; PHP läser bara den här filen i skriptets egen katalog när SCRIPT_FILENAME
; inte är ett strängprefix av DOCUMENT_ROOT (så är det på vissa webbhotell). Därför
; ligger samma fil i varje katalog under vendor/ som innehåller PHP.
; auto_prepend körs inte vid require, så lib/pdf.php kan fortfarande skapa PDF.
auto_prepend_file=${DOCUMENT_ROOT}/fullmakt/vendor/deny-direct.php
